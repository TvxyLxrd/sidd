<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Категории — SID Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="js/app.js" defer></script>
  <script src="js/pages.js" defer></script>
</head>
<body data-page="admin-categories">
  <div class="app">
    <header class="app-header">
      <div class="container app-header-inner">
        <a class="brand" href="admin-dashboard.html"><span class="brand-mark"><i class="fas fa-shield-halved"></i></span><span>SID Admin</span></a>
        <nav class="app-nav">
          <a href="admin-dashboard.html"><i class="fas fa-chart-pie"></i>Обзор</a>
          <a href="admin-requests.html"><i class="fas fa-list-check"></i>Заявки</a>
          <a href="admin-users.html"><i class="fas fa-users"></i>Пользователи</a>
          <a class="active" href="admin-services.html"><i class="fas fa-shapes"></i>Категории</a>
          <a href="dashboard.html"><i class="fas fa-arrow-up-right-from-square"></i>Кабинет</a>
        </nav>
        <div class="header-actions">
          <a class="user-chip" href="profile.html" aria-label="Открыть профиль"><span class="user-avatar" data-user-initials>AD</span><div><strong data-user-name>Администратор</strong><span data-user-role>Администратор</span></div></a>
          <button class="btn btn-ghost" type="button" data-logout aria-label="Выйти"><i class="fas fa-arrow-right-from-bracket"></i></button>
        </div>
      </div>
    </header>

    <main class="container page-main">
      <section class="page-heading">
        <div><span class="eyebrow">Структура заявок</span><h1>Категории</h1><p>Управляйте направлениями, по которым пользователи отправляют обращения.</p></div>
      </section>

      <section class="card" style="margin-bottom:18px">
        <div class="card-header"><div><h2>Добавить категорию</h2><p class="muted text-small">Код используется в API и должен содержать латиницу, цифры или дефисы</p></div></div>
        <form id="categoryForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="categoryName">Название</label>
              <input class="form-control" id="categoryName" type="text" minlength="2" maxlength="100" placeholder="Например: Финансы" required>
            </div>
            <div class="form-group">
              <label for="categorySlug">Код</label>
              <input class="form-control" id="categorySlug" type="text" pattern="[a-z0-9-]+" placeholder="finance" required>
            </div>
            <div class="form-group">
              <label for="categoryIcon">Иконка Font Awesome</label>
              <input class="form-control" id="categoryIcon" type="text" maxlength="50" placeholder="coins">
            </div>
            <div class="form-group">
              <label for="categoryDescription">Описание</label>
              <input class="form-control" id="categoryDescription" type="text" maxlength="500" placeholder="Платежи, счета и документы">
            </div>
          </div>
          <button class="btn btn-primary" type="submit"><i class="fas fa-plus"></i>Добавить категорию</button>
        </form>
      </section>

      <section id="categoriesList"></section>
    </main>
  </div>
</body>
</html>
