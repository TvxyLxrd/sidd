<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Все заявки — SID Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="js/app.js" defer></script>
  <script src="js/pages.js" defer></script>
</head>
<body data-page="admin-requests">
  <div class="app">
    <header class="app-header">
      <div class="container app-header-inner">
        <a class="brand" href="admin-dashboard.html"><span class="brand-mark"><i class="fas fa-shield-halved"></i></span><span>SID Admin</span></a>
        <nav class="app-nav">
          <a href="admin-dashboard.html"><i class="fas fa-chart-pie"></i>Обзор</a>
          <a class="active" href="admin-requests.html"><i class="fas fa-list-check"></i>Заявки</a>
          <a href="admin-users.html"><i class="fas fa-users"></i>Пользователи</a>
          <a href="admin-services.html"><i class="fas fa-shapes"></i>Категории</a>
          <a href="dashboard.html"><i class="fas fa-arrow-up-right-from-square"></i>Кабинет</a>
        </nav>
        <div class="header-actions">
          <a class="user-chip" href="profile.html" aria-label="Открыть профиль"><span class="user-avatar" data-user-initials>AD</span><div><strong data-user-name>Администратор</strong><span data-user-role>Администратор</span></div></a>
          <button class="btn btn-ghost" type="button" data-logout aria-label="Выйти"><i class="fas fa-arrow-right-from-bracket"></i></button>
        </div>
      </div>
    </header>

    <main class="container page-main">
      <section class="page-heading">
        <div><span class="eyebrow">Общая очередь</span><h1>Все заявки</h1><p>Контролируйте обращения пользователей и меняйте статус в подробной карточке.</p></div>
      </section>
      <section class="card">
        <div class="toolbar">
          <span class="badge badge-neutral" id="requestCount">0 заявок</span>
          <div class="toolbar-group">
            <input class="form-control search-control" id="searchInput" type="search" placeholder="Название, номер или автор">
            <select class="form-control" id="statusFilter">
              <option value="all">Все статусы</option>
              <option value="pending">Ожидают</option>
              <option value="in_progress">В работе</option>
              <option value="on_hold">На паузе</option>
              <option value="completed">Завершены</option>
              <option value="rejected">Отклонены</option>
            </select>
          </div>
        </div>
        <div id="adminRequestsList"></div>
      </section>
    </main>
  </div>
</body>
</html>
